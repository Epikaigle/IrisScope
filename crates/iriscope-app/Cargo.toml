[package]
name = "iriscope-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
iriscope-core = { path = "../iriscope-core" }
iriscope-imaging = { path = "../iriscope-imaging" }
slint = "=1.16.1"
rfd = "0.15.4"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
tiny-skia = "0.11"
ttf-parser = "0.25"

[build-dependencies]
slint-build = "=1.16.1"

[target.'cfg(target_os = "linux")'.dependencies]
iriscope-camera-linux = { path = "../iriscope-camera-linux" }

[target.'cfg(target_os = "windows")'.dependencies]
iriscope-camera-windows = { path = "../iriscope-camera-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
iriscope-camera-macos = { path = "../iriscope-camera-macos" }

[lints]
workspace = true
